name: 我有一个想法
description: 分享你想怎样记录、回顾或分享麦麦足迹。
title: "[想法] "
body:
  - type: textarea
    id: situation
    attributes:
      label: 在什么情况下想用到它
      placeholder: 例如旅行前想把几家特色店放进一个行程。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望怎样使用
      placeholder: 一两句话说清楚就好。
    validations:
      required: true
