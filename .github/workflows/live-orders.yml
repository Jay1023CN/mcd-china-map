name: Verify live mobile order sync
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-mobile-order-sync
  cancel-in-progress: false
jobs:
  live-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated cloud test browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test real orders on the deployed mobile website
        env:
          LIVE_ORDER_TEST_CLOUD: '1'
          MCD_MCP_TOKEN: ${{ secrets.MCD_LIVE_TEST_TOKEN }}
        run: node tests/browser-live-orders.cjs
