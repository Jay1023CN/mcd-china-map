name: Verify China map
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/GROWTH.md'
      - 'docs/FEEDBACK.md'
      - 'docs/growth-assets/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web server dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Engine and offline MCP regression tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node --test tests/journal-engine.test.js tests/order-journal.test.js tests/share-card.test.js tests/journey-insights.test.js tests/wishlist-engine.test.js tests/memory-card.test.js tests/journal-search.test.js tests/archive-merge.test.js
          node --test tests/journal-collections.test.cjs tests/store-navigation.test.cjs
          node --test tests/collection-preferences.test.cjs
          node --test tests/national-store-search.test.cjs
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rebuild public pages
        run: |
          python scripts/build_global_journal.py --output index.html
          python scripts/build_global_journal.py --archive examples/china-journal.synthetic.json --output docs/china-demo.html
          git diff --exit-code -- index.html docs/china-demo.html
      - name: Install test browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install chromium
      - name: Run isolated browser acceptance
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force private | Out-Null
          Start-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/serve-local.ps1', '-NoBrowser')
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try {
              Invoke-WebRequest http://127.0.0.1:8765/ -Method Head -ErrorAction Stop | Out-Null
              $ready = $true
              break
            } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ready) { throw 'Local server did not start' }
          node tests/browser-smoke.cjs
          node tests/browser-features.cjs
          node tests/browser-wishlist.cjs
          node tests/browser-connect.cjs
          node tests/browser-memory.cjs
          node tests/browser-discovery.cjs
          node tests/browser-plan-share.cjs
      - name: Run remembered web session acceptance
        run: python tests/run_browser_web_sessions.py
      - name: Run mobile static web acceptance
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/build_web_app.py
          $env:STATIC_WEB_ROOT = "$PWD/dist/web"
          node tests/browser-mobile-web.cjs
          node tests/browser-collections.cjs
          node tests/browser-national-stores.cjs
          node tests/browser-taiwan-names.cjs
          node tests/browser-directory-saved.cjs
          node tests/browser-featured-photos.cjs
      - name: Verify distribution whitelist
        run: python scripts/package_skill.py
