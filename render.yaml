# One free Python service. No paid disk or expiring managed database.
services:
  - type: web
    name: mcd-china-map
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-web.txt && python scripts/download_web_build.py --commit "$RENDER_GIT_COMMIT"
    startCommand: python scripts/web_api.py --prebuilt --host 0.0.0.0 --port "$PORT" --origin "$RENDER_EXTERNAL_URL"
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.16"
